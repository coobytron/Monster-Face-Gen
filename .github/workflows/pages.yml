name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html styles.css v6-art-finish.css *.js _site/
          cp -r assets _site/assets
          touch _site/.nojekyll
      - name: Check every file index.html loads is present
        run: |
          missing=0
          for ref in $(grep -oE '(src|href)="[^"#:]+"' index.html | sed -E 's/^(src|href)="(.*)"$/\2/' | sed 's/?.*//'); do
            if [ ! -f "_site/$ref" ]; then
              echo "Missing from site: $ref"
              missing=1
            fi
          done
          exit $missing
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
