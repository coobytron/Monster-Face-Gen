name: Contact Sheet QA
on:
  workflow_dispatch:
    inputs:
      commit_artifacts:
        description: Commit generated review artifacts to the current branch
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'assets/**'
      - 'reviews/**'
      - 'docs/**'
      - 'README.md'
      - 'index.html'
      - 'internal/recipe-director/**'
      - 'v8-compatibility.js'
      - 'v9-hybrid-bundles.js'
      - 'v9-pair-junctions.js'
      - 'scripts/contact-sheet-qa.js'
      - 'scripts/hybrid-bundle-*.js'
      - 'scripts/pair-junction-*.js'
      - 'scripts/hero-fidelity-*.js'
      - 'scripts/hero-review-*.js'
      - 'scripts/library-fidelity-*.js'
      - 'scripts/update-hero-*.js'
      - 'scripts/update-library-rollout-*.js'
      - 'scripts/update-v10-*.js'
      - 'scripts/v10-*-qa.js'
      - 'scripts/run-qa-ci.js'
      - 'tests/**'
      - 'schemas/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/contact-sheet-qa.yml'
  pull_request:
    paths:
      - 'assets/**'
      - 'reviews/**'
      - 'docs/**'
      - 'README.md'
      - 'index.html'
      - 'internal/recipe-director/**'
      - 'v8-compatibility.js'
      - 'v9-hybrid-bundles.js'
      - 'v9-pair-junctions.js'
      - 'scripts/contact-sheet-qa.js'
      - 'scripts/hybrid-bundle-*.js'
      - 'scripts/pair-junction-*.js'
      - 'scripts/hero-fidelity-*.js'
      - 'scripts/hero-review-*.js'
      - 'scripts/library-fidelity-*.js'
      - 'scripts/update-hero-*.js'
      - 'scripts/update-library-rollout-*.js'
      - 'scripts/update-v10-*.js'
      - 'scripts/v10-*-qa.js'
      - 'scripts/run-qa-ci.js'
      - 'tests/**'
      - 'schemas/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/contact-sheet-qa.yml'
permissions:
  contents: write
jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm test
      - name: Generate review sheets
        id: qa
        shell: bash
        env:
          QA_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          set +e
          timeout --foreground --signal=TERM 10m npm run qa:ci -- --base "$QA_BASE_SHA" --head "$QA_HEAD_SHA" 2>&1 | tee qa-run.log
          code=${PIPESTATUS[0]}
          mkdir -p generated/qa
          cp qa-run.log generated/qa/run.log
          if [ "$code" -eq 124 ]; then
            echo "QA rendering exceeded the 10-minute limit." | tee -a qa-run.log
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monster-face-contact-sheet-qa
          path: generated/qa
          if-no-files-found: error
      - name: Commit generated review artifacts
        if: always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.commit_artifacts))
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json assets/manifest.json README.md docs/ASSET-GUIDE.md generated/qa
          if git diff --cached --quiet; then
            echo "Generated artifacts are already current."
          else
            git commit -m "Update deterministic QA review artifacts [skip ci]"
            git push
          fi
      - name: Enforce renderer result
        if: steps.qa.outputs.exit_code != '0'
        run: exit 1
