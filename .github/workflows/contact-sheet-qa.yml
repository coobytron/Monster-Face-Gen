name: Contact Sheet QA
on:
  workflow_dispatch:
    inputs:
      commit_artifacts:
        description: Commit generated review artifacts to the current branch
        required: false
        default: true
        type: boolean
  push:
    paths:
      - 'assets/**'
      - 'reviews/**'
      - 'docs/**'
      - 'README.md'
      - 'index.html'
      - 'internal/recipe-director/**'
      - 'v8-compatibility.js'
      - 'v9-hybrid-bundles.js'
      - 'v9-pair-junctions.js'
      - 'scripts/contact-sheet-qa.js'
      - 'scripts/hybrid-bundle-*.js'
      - 'scripts/pair-junction-*.js'
      - 'scripts/hero-fidelity-*.js'
      - 'scripts/hero-review-*.js'
      - 'scripts/library-fidelity-*.js'
      - 'scripts/update-hero-*.js'
      - 'scripts/update-library-rollout-*.js'
      - 'tests/**'
      - 'schemas/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/contact-sheet-qa.yml'
  pull_request:
    paths:
      - 'assets/**'
      - 'reviews/**'
      - 'docs/**'
      - 'README.md'
      - 'index.html'
      - 'internal/recipe-director/**'
      - 'v8-compatibility.js'
      - 'v9-hybrid-bundles.js'
      - 'v9-pair-junctions.js'
      - 'scripts/contact-sheet-qa.js'
      - 'scripts/hybrid-bundle-*.js'
      - 'scripts/pair-junction-*.js'
      - 'scripts/hero-fidelity-*.js'
      - 'scripts/hero-review-*.js'
      - 'scripts/library-fidelity-*.js'
      - 'scripts/update-hero-*.js'
      - 'scripts/update-library-rollout-*.js'
      - 'tests/**'
      - 'schemas/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/contact-sheet-qa.yml'
permissions:
  contents: write
jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply prepared library rollout
        run: |
          if [ -f scripts/apply-library-rollout.js ]; then
            node scripts/apply-library-rollout.js
          fi
      - name: Commit rollout source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rollout source is already materialized."
          else
            git commit -m "Roll hero-quality art across reviewed recipe library [skip ci]"
            git push origin HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}
          fi
      - run: npm install --package-lock-only
      - run: npm ci
      - name: Run test suite
        id: tests
        shell: bash
        run: |
          set +e
          npm test > test-run.log 2>&1
          code=$?
          cat test-run.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monster-face-test-log
          path: test-run.log
          if-no-files-found: error
      - name: Enforce test result
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
      - name: Generate review sheets
        id: qa
        shell: bash
        run: |
          set +e
          npm run qa > qa-run.log 2>&1
          code=$?
          mkdir -p generated/qa
          cp qa-run.log generated/qa/run.log
          cat qa-run.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monster-face-contact-sheet-qa
          path: generated/qa
          if-no-files-found: error
      - name: Commit generated review artifacts
        if: steps.qa.outputs.exit_code == '0' && (github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.commit_artifacts))
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json assets/manifest.json README.md docs/ASSET-GUIDE.md generated/qa
          if git diff --cached --quiet; then
            echo "Generated artifacts are already current."
          else
            git commit -m "Update deterministic QA review artifacts [skip ci]"
            git push origin HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}
          fi
      - name: Enforce renderer result
        if: steps.qa.outputs.exit_code != '0'
        run: exit 1
